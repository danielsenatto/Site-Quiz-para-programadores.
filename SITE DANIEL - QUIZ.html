<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevQuiz — Quiz para Programadores</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070b14;
            --card: #101827;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --cyan: #22d3ee;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(99, 102, 241, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(34, 211, 238, 0.12),
                    transparent 30%
                ),
                var(--bg);
        }

        /* ================================
           TELA INICIAL
        ================================= */

        .start-screen {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .start-box {
            width: 100%;
            max-width: 700px;

            padding: 55px 40px;

            text-align: center;

            border: 1px solid var(--border);
            border-radius: 30px;

            background: rgba(16, 24, 39, 0.82);

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45);
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            font-size: 34px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--cyan)
                );

            box-shadow:
                0 15px 40px rgba(99, 102, 241, 0.3);
        }

        .start-box h1 {
            font-size: clamp(38px, 7vw, 65px);

            margin-bottom: 18px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    var(--primary-light),
                    var(--cyan)
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .start-box p {
            max-width: 520px;

            margin: auto;

            color: var(--muted);

            font-size: 18px;

            line-height: 1.6;
        }

        .quiz-info {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;

            margin: 30px 0;
        }

        .info {
            padding: 10px 16px;

            border-radius: 50px;

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid var(--border);

            color: #cbd5e1;

            font-size: 14px;
        }

        .start-button,
        .next-button,
        .restart-button {
            border: none;

            cursor: pointer;

            color: white;

            font-weight: bold;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #4f46e5
                );

            transition: 0.25s;
        }

        .start-button {
            width: 100%;

            padding: 18px;

            font-size: 17px;
        }

        .start-button:hover,
        .next-button:hover,
        .restart-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 35px
                rgba(99, 102, 241, 0.3);
        }

        /* ================================
           TELA DO QUIZ
        ================================= */

        .quiz-screen {
            display: none;

            min-height: 100vh;

            padding: 35px 20px 70px;
        }

        .quiz-container {
            width: 100%;
            max-width: 850px;

            margin: auto;
        }

        .top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 15px;
        }

        .brand {
            font-weight: bold;

            font-size: 20px;
        }

        .counter {
            color: var(--muted);

            font-size: 14px;
        }

        /* BARRA DE PROGRESSO */

        .progress {
            width: 100%;

            height: 8px;

            overflow: hidden;

            border-radius: 50px;

            background: #1e293b;

            margin-bottom: 35px;
        }

        .progress-bar {
            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--cyan)
                );

            transition: 0.4s;
        }

        /* CARD DA PERGUNTA */

        .question-card {
            padding: 35px;

            border: 1px solid var(--border);

            border-radius: 25px;

            background:
                rgba(16, 24, 39, 0.9);

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.3);
        }

        .question-tag {
            display: inline-block;

            padding: 7px 12px;

            margin-bottom: 20px;

            border-radius: 8px;

            color: var(--primary-light);

            background:
                rgba(99, 102, 241, 0.12);

            font-size: 13px;

            font-weight: bold;
        }

        .question-card h2 {
            font-size: clamp(22px, 4vw, 30px);

            line-height: 1.35;

            margin-bottom: 28px;
        }

        /* ALTERNATIVAS */

        .options {
            display: grid;

            gap: 13px;
        }

        .option {
            position: relative;

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 18px;

            border: 1px solid var(--border);

            border-radius: 15px;

            background:
                rgba(255, 255, 255, 0.035);

            cursor: pointer;

            transition: 0.2s;
        }

        .option:hover {
            border-color:
                rgba(129, 140, 248, 0.5);

            background:
                rgba(99, 102, 241, 0.08);

            transform: translateX(4px);
        }

        .option input {
            display: none;
        }

        .letter {
            width: 36px;
            height: 36px;

            min-width: 36px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #1e293b;

            color: #cbd5e1;

            font-weight: bold;
        }

        .option.selected {
            border-color: var(--primary);

            background:
                rgba(99, 102, 241, 0.14);
        }

        .option.selected .letter {
            color: white;

            background: var(--primary);
        }

        /* BOTÃO PRÓXIMA */

        .next-button {
            width: 100%;

            padding: 17px;

            margin-top: 25px;

            font-size: 16px;
        }

        .next-button:disabled {
            opacity: 0.4;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        /* ================================
           TELA DE RESULTADO
        ================================= */

        .result-screen {
            display: none;

            min-height: 100vh;

            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .result-box {
            width: 100%;

            max-width: 700px;

            padding: 50px 35px;

            text-align: center;

            border: 1px solid var(--border);

            border-radius: 30px;

            background:
                rgba(16, 24, 39, 0.9);

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.45);
        }

        .result-icon {
            font-size: 55px;

            margin-bottom: 15px;
        }

        .result-box h1 {
            font-size: 35px;

            margin-bottom: 10px;
        }

        .result-description {
            color: var(--muted);

            line-height: 1.6;

            margin-bottom: 30px;
        }

        /* CÍRCULO DA PONTUAÇÃO */

        .score-circle {
            width: 180px;
            height: 180px;

            margin: 0 auto 30px;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            border-radius: 50%;

            border:
                10px solid
                rgba(99, 102, 241, 0.2);

            background:
                rgba(99, 102, 241, 0.08);
        }

        .score-circle strong {
            font-size: 48px;

            color: var(--primary-light);
        }

        .score-circle span {
            color: var(--muted);

            font-size: 14px;
        }

        /* ESTATÍSTICAS */

        .result-stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 30px;
        }

        .stat {
            padding: 18px 10px;

            border-radius: 15px;

            background:
                rgba(255, 255, 255, 0.04);

            border: 1px solid var(--border);
        }

        .stat strong {
            display: block;

            font-size: 22px;

            margin-bottom: 5px;
        }

        .stat span {
            color: var(--muted);

            font-size: 12px;
        }

        .restart-button {
            width: 100%;

            padding: 17px;

            font-size: 16px;
        }

        /* ================================
           RESPONSIVO
        ================================= */

        @media (max-width: 600px) {

            .start-box,
            .result-box {
                padding: 35px 22px;
            }

            .question-card {
                padding: 25px 20px;
            }

            .result-stats {
                grid-template-columns: 1fr;
            }

            .top {
                gap: 10px;
            }

            .brand {
                font-size: 17px;
            }

            .counter {
                font-size: 12px;
            }
        }
    </style>

</head>


<body>


    <!-- =====================================
         TELA INICIAL
    ====================================== -->

    <section
        class="start-screen"
        id="startScreen"
    >

        <div class="start-box">

            <div class="logo">
                💻
            </div>

            <h1>
                DevQuiz
            </h1>

            <p>
                Um desafio rápido para testar seus
                conhecimentos sobre programação e tecnologia.
            </p>


            <div class="quiz-info">

                <span class="info">
                    5 perguntas
                </span>

                <span class="info">
                    Nível iniciante
                </span>

                <span class="info">
                    Resultado instantâneo
                </span>

            </div>


            <button
                class="start-button"
                onclick="startQuiz()"
            >
                Começar Quiz →
            </button>

        </div>

    </section>



    <!-- =====================================
         TELA DO QUIZ
    ====================================== -->

    <section
        class="quiz-screen"
        id="quizScreen"
    >

        <div class="quiz-container">


            <div class="top">

                <div class="brand">
                    💻 DevQuiz
                </div>

                <div
                    class="counter"
                    id="counter"
                >
                    Pergunta 1 de 5
                </div>

            </div>


            <!-- BARRA DE PROGRESSO -->

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>


            <!-- PERGUNTA -->

            <div class="question-card">

                <span
                    class="question-tag"
                    id="questionTag"
                >
                    PERGUNTA 01
                </span>


                <h2
                    id="questionText"
                ></h2>


                <div
                    class="options"
                    id="options"
                ></div>


                <button
                    class="next-button"
                    id="nextButton"
                    onclick="nextQuestion()"
                    disabled
                >
                    Próxima pergunta →
                </button>

            </div>

        </div>

    </section>



    <!-- =====================================
         TELA DE RESULTADO
    ====================================== -->

    <section
        class="result-screen"
        id="resultScreen"
    >

        <div class="result-box">


            <div
                class="result-icon"
                id="resultIcon"
            >
                🏆
            </div>


            <h1
                id="resultTitle"
            >
                Excelente!
            </h1>


            <p
                class="result-description"
                id="resultDescription"
            >
                Você foi muito bem no desafio.
            </p>


            <!-- PONTUAÇÃO -->

            <div class="score-circle">

                <strong
                    id="finalScore"
                >
                    0
                </strong>

                <span>
                    de 5 pontos
                </span>

            </div>


            <!-- ESTATÍSTICAS -->

            <div class="result-stats">


                <div class="stat">

                    <strong
                        id="correctAnswers"
                    >
                        0
                    </strong>

                    <span>
                        Acertos
                    </span>

                </div>


                <div class="stat">

                    <strong
                        id="wrongAnswers"
                    >
                        0
                    </strong>

                    <span>
                        Erros
                    </span>

                </div>


                <div class="stat">

                    <strong
                        id="percentage"
                    >
                        0%
                    </strong>

                    <span>
                        Aproveitamento
                    </span>

                </div>


            </div>


            <button
                class="restart-button"
                onclick="restartQuiz()"
            >
                Fazer o quiz novamente ↻
            </button>


        </div>

    </section>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>


        /* =====================================
           PERGUNTAS
        ====================================== */

        const questions = [

            {
                question:
                    "Qual linguagem é usada para estruturar o conteúdo de uma página web?",

                options: [
                    "Python",
                    "HTML",
                    "Java",
                    "SQL"
                ],

                answer: 1
            },


            {
                question:
                    "Qual linguagem é conhecida por adicionar interatividade às páginas web?",

                options: [
                    "JavaScript",
                    "HTML",
                    "CSS",
                    "SQL"
                ],

                answer: 0
            },


            {
                question:
                    "Qual tecnologia é usada principalmente para estilizar páginas web?",

                options: [
                    "Python",
                    "CSS",
                    "Java",
                    "PHP"
                ],

                answer: 1
            },


            {
                question:
                    "Qual símbolo é usado para iniciar um comentário de uma linha em JavaScript?",

                options: [
                    "<!--",
                    "#",
                    "//",
                    "/*/"
                ],

                answer: 2
            },


            {
                question:
                    "Qual linguagem de programação possui como símbolo famoso uma xícara de café?",

                options: [
                    "Python",
                    "Java",
                    "C++",
                    "Ruby"
                ],

                answer: 1
            }

        ];


        /* =====================================
           VARIÁVEIS
        ====================================== */

        let currentQuestion = 0;

        let score = 0;

        let selectedAnswer = null;



        /* =====================================
           INICIAR QUIZ
        ====================================== */

        function startQuiz() {

            currentQuestion = 0;

            score = 0;

            selectedAnswer = null;


            document
                .getElementById("startScreen")
                .style.display = "none";


            document
                .getElementById("resultScreen")
                .style.display = "none";


            document
                .getElementById("quizScreen")
                .style.display = "block";


            showQuestion();

        }



        /* =====================================
           MOSTRAR PERGUNTA
        ====================================== */

        function showQuestion() {

            const question =
                questions[currentQuestion];


            selectedAnswer = null;


            document
                .getElementById("questionText")
                .textContent =
                question.question;


            document
                .getElementById("questionTag")
                .textContent =
                "PERGUNTA " +
                String(currentQuestion + 1)
                    .padStart(2, "0");


            document
                .getElementById("counter")
                .textContent =
                "Pergunta " +
                (currentQuestion + 1) +
                " de " +
                questions.length;



            /* PROGRESSO */

            const progress =
                (currentQuestion /
                questions.length) *
                100;


            document
                .getElementById("progressBar")
                .style.width =
                progress + "%";



            /* LIMPAR ALTERNATIVAS */

            const optionsContainer =
                document
                    .getElementById("options");


            optionsContainer.innerHTML = "";


            const letters =
                ["A", "B", "C", "D"];



            /* CRIAR ALTERNATIVAS */

            question.options.forEach(
                (option, index) => {

                    const label =
                        document.createElement("label");


                    label.className =
                        "option";


                    label.innerHTML = `

                        <input
                            type="radio"
                            name="answer"
                            value="${index}"
                        >

                        <span class="letter">
                            ${letters[index]}
                        </span>

                        <span>
                            ${option}
                        </span>

                    `;



                    label.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(".option")
                                .forEach(item => {

                                    item.classList
                                        .remove("selected");

                                });


                            label.classList
                                .add("selected");


                            selectedAnswer =
                                index;


                            document
                                .getElementById("nextButton")
                                .disabled =
                                false;

                        }
                    );


                    optionsContainer
                        .appendChild(label);

                }
            );



            /* BOTÃO */

            const button =
                document
                    .getElementById("nextButton");


            button.disabled = true;


            if (
                currentQuestion ===
                questions.length - 1
            ) {

                button.textContent =
                    "Finalizar Quiz ✓";

            } else {

                button.textContent =
                    "Próxima pergunta →";

            }

        }



        /* =====================================
           PRÓXIMA PERGUNTA
        ====================================== */

        function nextQuestion() {


            if (
                selectedAnswer === null
            ) {

                return;

            }



            /* VERIFICAR RESPOSTA */

            if (
                selectedAnswer ===
                questions[currentQuestion].answer
            ) {

                score++;

            }



            currentQuestion++;



            /* CONTINUAR OU FINALIZAR */

            if (
                currentQuestion <
                questions.length
            ) {

                showQuestion();

            } else {

                showResult();

            }

        }



        /* =====================================
           MOSTRAR RESULTADO
        ====================================== */

        function showResult() {


            document
                .getElementById("quizScreen")
                .style.display = "none";


            document
                .getElementById("resultScreen")
                .style.display = "flex";



            const total =
                questions.length;


            const percentage =
                Math.round(
                    (score / total) * 100
                );


            const wrong =
                total - score;



            /* NÚMEROS */

            document
                .getElementById("finalScore")
                .textContent =
                score;


            document
                .getElementById("correctAnswers")
                .textContent =
                score;


            document
                .getElementById("wrongAnswers")
                .textContent =
                wrong;


            document
                .getElementById("percentage")
                .textContent =
                percentage + "%";



            /* MENSAGEM */

            let title;

            let description;

            let icon;



            if (
                score === total
            ) {

                icon = "🏆";

                title =
                    "Perfeito!";

                description =
                    "Você acertou todas as perguntas. Mandou muito bem! Seu conhecimento em programação está excelente.";

            }


            else if (
                score >= 4
            ) {

                icon = "🚀";

                title =
                    "Muito bom!";

                description =
                    "Você demonstrou que já domina vários conceitos importantes de programação.";

            }


            else if (
                score >= 3
            ) {

                icon = "💻";

                title =
                    "Bom trabalho!";

                description =
                    "Você está no caminho certo. Continue praticando e seu conhecimento vai evoluir cada vez mais.";

            }


            else if (
                score >= 1
            ) {

                icon = "📚";

                title =
                    "Continue estudando!";

                description =
                    "Você já começou sua jornada. Revise os conceitos e tente novamente para melhorar sua pontuação.";

            }


            else {

                icon = "🔥";

                title =
                    "Hora de praticar!";

                description =
                    "Não desanime. Todo programador começa aprendendo o básico. Estude, pratique e tente novamente.";

            }



            document
                .getElementById("resultIcon")
                .textContent =
                icon;


            document
                .getElementById("resultTitle")
                .textContent =
                title;


            document
                .getElementById("resultDescription")
                .textContent =
                description;

        }



        /* =====================================
           REINICIAR QUIZ
        ====================================== */

        function restartQuiz() {

            document
                .getElementById("resultScreen")
                .style.display =
                "none";


            document
                .getElementById("startScreen")
                .style.display =
                "flex";

        }

    </script>

</body>

</html>
